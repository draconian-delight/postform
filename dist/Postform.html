/* Keep the writing surface spacious and secondary controls quiet. */
.masthead{height:72px}
.platform-label{font-size:13px;font-weight:600;color:#42367a;background:#e6e3f4;padding:7px 11px;border-radius:7px}
.page-heading{padding:13px 0 25px}
.editor-card{border-radius:17px;box-shadow:0 8px 26px #1c243808}
.source-card:focus-within{border-color:var(--primary);box-shadow:0 0 0 2px #4934bd18}
.format-button{width:44px;height:44px;gap:8px;border-radius:8px}
.format-button:hover{background:#f0eef9;border-color:#cbd0df}
.format-button[aria-pressed=true]{background:var(--accent-soft);color:#352083;border-color:#9f90d0}
.clear-style-button{width:auto;padding:8px 10px}
.clear-style-label{font-size:12px;font-weight:500;white-space:nowrap}
.rich-editor,.output-card textarea{height:clamp(300px,calc(100dvh - 410px),560px);line-height:1.85}
.rich-editor{font-family:"Segoe UI","Segoe UI Emoji",Arial,sans-serif}
.rich-editor a{color:var(--primary)}
.rich-editor.is-empty:before,.output-card textarea::placeholder{color:#5b687f}
.output-card{background:#fdfcff}
.button{min-height:44px;border-radius:9px}
.button-outline,.setting select,.format-mode,dialog input{border-color:#78849c}
.button-outline:hover{border-color:#5a6680;background:#f3f1fa}
.notice{min-height:0;padding:0}
.notice:not(:empty){padding-top:10px}
@media(max-width:1050px){.clear-style-label{display:none}.clear-style-button{width:44px}}
@media(max-width:750px){.masthead{height:66px}.platform-label{font-size:12px;padding:6px 8px}.page-heading{padding:12px 0 22px}.rich-editor{height:300px}.output-card textarea{height:320px}.format-button{width:44px;height:44px}}
@media(max-width:380px){.output-heading h2{max-width:120px;line-height:1.35}.format-button{width:44px}.toolbar-divider{margin:0 4px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}

/* Output styles stay visible; secondary controls expand above the draft. */
.header-links{display:flex;align-items:center;gap:18px}
.github-link{color:var(--primary);font-size:14px;font-weight:600;text-decoration:none;padding:8px 0}
.github-link:hover{text-decoration:underline;text-underline-offset:3px}
.workspace-controls{display:grid;grid-template-columns:minmax(0,1fr);align-items:start;margin-bottom:18px}
.output-mode-bar{grid-area:1/1;width:max-content;max-width:100%;position:relative;z-index:1}
.output-mode-bar .format-mode{height:44px;min-width:226px}
.workspace-controls .options-panel{grid-area:1/1;margin:0;border:0;padding:0;border-radius:0;background:transparent}
.workspace-controls .options-panel>summary{display:flex;width:max-content;min-height:44px;margin-left:auto;padding:10px 5px}
.workspace-controls .options-panel[open]>summary{min-height:44px}
.workspace-controls .options-content{margin-top:14px;padding:20px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.workspace-controls .settings-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
.rough-spacing-note{font-size:12px;line-height:1.5;color:var(--muted)}
.draft-actions{display:flex;align-items:center;gap:14px}
#restoreDraft[hidden],#capsText[hidden]{display:none}
.editor-toolbar{height:auto;min-height:58px;flex-wrap:wrap;row-gap:5px}
.caps-button{font-size:10px;font-weight:700;letter-spacing:.3px}
.caps-button:disabled{color:#6b7588}
.rich-editor.rough-active [data-postform-caps="true"]{text-decoration-line:underline;text-decoration-style:dotted;text-decoration-color:var(--primary);text-underline-offset:4px}
.setting select:disabled{background:#edf0f7;color:var(--muted)}
@media(max-width:750px){.output-mode-bar .format-mode{min-width:211px}.workspace-controls .options-content{padding:16px}.workspace-controls .settings-grid{grid-template-columns:1fr 1fr}.draft-actions{gap:10px}.draft-actions .text-button{font-size:12px}}
@media(max-width:450px){.header-links .platform-label{display:none}.header-links{gap:0}.draft-actions{gap:7px}.output-mode-bar .format-mode{min-width:200px}.output-mode-bar .mode-button{font-size:12px;padding:5px 8px}}
@media(max-width:380px){.output-mode-bar .format-mode{min-width:190px}.workspace-controls .settings-grid{grid-template-columns:1fr}.workspace-controls .options-panel>summary{font-size:13px;gap:5px}.draft-actions .text-button{font-size:11px}.draft-actions{gap:6px}}
</style>

<body>
  <div class="app">
    <header class="masthead">
      <a class="brand" href="#" aria-label="Postform home"><span class="brand-mark" aria-hidden="true">P</span>Postform</a>
      <div class="header-links"><span class="platform-label">LinkedIn &amp; X</span><a id="githubLink" class="github-link" href="https://github.com/draconian-delight/postform" target="_blank" rel="noopener noreferrer">GitHub <span aria-hidden="true">↗</span></a></div>
    </header>
    <main>
      <div class="page-heading"><h1>Format your post</h1><p>Edit on the left. Copy from the right.</p></div>
      <section class="workspace" aria-label="Post formatter">
        <div class="workspace-controls">
          <div class="output-mode-bar"><div class="format-mode" role="group" aria-label="Output mode"><button type="button" class="mode-button active" id="unicodeMode" aria-pressed="true">Unicode</button><button type="button" class="mode-button" id="plainMode" aria-pressed="false">Plain</button><button type="button" class="mode-button" id="roughMode" aria-pressed="false">Rough</button></div></div>
          <details class="options-panel" id="optionsPanel">
            <summary>Options<svg viewBox="0 0 20 20" aria-hidden="true"><path d="m6 8 4 4 4-4"/></svg></summary>
            <div class="options-content">
              <div class="settings-grid">
                <div class="setting"><label for="spacing">Spacing</label><select id="spacing"><option value="social">Social spacing</option><option value="roomy">Extra space between list items</option><option value="preserve">Keep my line breaks</option></select><span id="roughSpacingNote" class="rough-spacing-note" hidden>Rough uses sentence spacing.</span></div>
                <div class="setting"><label for="font">Bold style</label><select id="font"><option value="sans">𝗦𝗮𝗻𝘀 + 𝟏𝟐𝟑</option><option value="serif">𝐒𝐞𝐫𝐢𝐟 + 𝟏𝟐𝟑</option></select></div>
                <div class="setting"><label for="linkStyle">Links</label><select id="linkStyle"><option value="colon">Label: URL</option><option value="newline">URL on a new line</option></select></div>
              </div>
              <div class="options-bottom"><label class="paste-setting"><input id="richPaste" type="checkbox" checked> Keep pasted formatting</label><span id="saveStatus">Drafts saved on this device</span></div>
              <div class="optional-actions"><button type="button" class="button button-outline" id="loadExample">Try an example</button><button type="button" class="button button-outline" id="downloadText">Save post as .txt</button><button type="button" class="button button-outline" id="saveTool">Download app</button></div>
            </div>
          </details>
        </div>
        <div class="editors">
          <section class="editor-card source-card" aria-labelledby="draftLabel">
            <div class="card-top"><h2 id="draftLabel">Your draft</h2><div class="draft-actions"><button type="button" class="text-button" id="restoreDraft" hidden>Restore draft</button><button type="button" class="text-button" id="clearDraft" aria-label="Clear draft">Clear</button></div></div>
            <div class="editor-toolbar" role="group" aria-label="Text formatting">
              <button type="button" class="format-button" id="boldText" data-command="bold" title="Bold (Ctrl+B / ⌘B)" aria-label="Bold" aria-pressed="false"><strong>B</strong></button>
              <button type="button" class="format-button" id="italicText" data-command="italic" title="Italic (Ctrl+I / ⌘I)" aria-label="Italic" aria-pressed="false"><em>I</em></button>
              <button type="button" class="format-button caps-button" id="capsText" title="Toggle uppercase emphasis in Rough output" aria-label="CAPS emphasis" aria-pressed="false" hidden disabled>CAPS</button>
              <span class="toolbar-divider" aria-hidden="true"></span>
              <button type="button" class="format-button" id="bulletList" data-command="insertUnorderedList" title="Bullet list" aria-label="Bullet list" aria-pressed="false"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M8 5h8M8 10h8M8 15h8M3 5h1M3 10h1M3 15h1"/></svg></button>
              <button type="button" class="format-button" id="editLink" title="Add or edit link" aria-label="Add or edit link"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="m8 12 4-4M7 13l-1 1a3 3 0 0 1-4-4l3-3a3 3 0 0 1 4 0m2 0 1-1a3 3 0 0 1 4 4l-3 3a3 3 0 0 1-4 0"/></svg></button>
              <button type="button" class="format-button clear-style-button" id="clearFormat" data-command="removeFormat" title="Remove bold and italics" aria-label="Remove formatting"><span aria-hidden="true">T×</span><span class="clear-style-label">Clear style</span></button>
            </div>
            <div id="source" class="rich-editor" contenteditable="true" role="textbox" aria-multiline="true" aria-labelledby="draftLabel" aria-describedby="sourceHelp" spellcheck="true" data-placeholder="Paste your post or start writing…"></div>
            <div class="card-footer"><span id="sourceHelp">Select text to format</span></div>
          </section>
          <section class="editor-card output-card" aria-labelledby="outputLabel">
            <div class="card-top output-heading"><h2><label id="outputLabel" for="output">Your formatted post</label></h2><button class="button button-primary" id="copyPost" type="button"><svg viewBox="0 0 20 20" aria-hidden="true"><rect x="7" y="7" width="9" height="10" rx="2"/><path d="M12 7V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h2"/></svg><span id="copyLabel">Copy post</span><span class="keyboard-hint" aria-hidden="true">Ctrl ↵</span></button></div>
            <p id="outputDescription" class="preview-label">Unicode preview</p>
            <textarea id="output" readonly spellcheck="false" aria-describedby="outputDescription" placeholder="Your formatted post will appear here."></textarea>
            <div class="card-footer"><span id="characterCount">0 characters</span><button type="button" class="text-button" id="selectOutput">Select all</button></div>
          </section>
        </div>
        <div id="notice" class="notice" role="status" aria-live="polite"></div>
      </section>
    </main>
  </div>
  <dialog id="linkDialog" aria-labelledby="linkTitle"><form id="linkForm"><h2 id="linkTitle">Edit link</h2><label for="linkText">Text</label><input id="linkText" type="text" required autocomplete="off"><label for="linkUrl">URL</label><input id="linkUrl" type="text" required placeholder="https://example.com" autocomplete="off"><p id="linkError" role="alert"></p><div class="dialog-actions"><button type="button" class="text-button" id="removeLink">Remove link</button><button type="button" class="button button-outline" id="cancelLink">Cancel</button><button type="submit" class="button button-primary">Apply</button></div></form></dialog>

    if ((event.ctrlKey || event.metaKey) && event.key === 'Enter') { event.preventDefault(); copyPost(); }
  });
  if (/Mac|iPhone|iPad/.test(navigator.platform)) document.querySelector('.keyboard-hint').textContent = '⌘ ↵';

  function download(data, filename, type) {
    const blob = new Blob([data], { type });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 30000);
  }
  $('downloadText').addEventListener('click', () => download(output.value, 'formatted-post.txt', 'text/plain;charset=utf-8'));
  $('saveTool').addEventListener('click', () => {
    // Build a fresh copy from the document without carrying the current draft or saved state.
    const clean = document.documentElement.cloneNode(true);
    clean.querySelector('#source').textContent = '';
    clean.querySelector('#output').textContent = '';
    clean.querySelector('#notice').textContent = '';
    clean.querySelector('#optionsPanel').removeAttribute('open');
    for (const select of clean.querySelectorAll('select')) for (const option of select.options) option.removeAttribute('selected');
    download('<!doctype html>\n' + clean.outerHTML, 'Postform.html', 'text/html;charset=utf-8');
    notice('App downloaded. Open Postform.html to use it offline.');
  });

  function richTextToMarkdown(html) {
    // Inert template: pasted markup is never added to the live document or executed.
    const template = document.createElement('template');
    template.innerHTML = html;
    const root = template.content;
    let meaningful = false;
    const ignored = new Set(['SCRIPT', 'STYLE', 'NOSCRIPT', 'IFRAME', 'OBJECT', 'SVG', 'HEAD', 'META', 'LINK']);
    const escapeMarkdown = text => text.replace(/([\\`*_\[\]])/g, '\\$1');
    const raw = text => ({ text, raw: true });
    function trimFragments(fragments) {
      const result = fragments.map(part => ({ ...part }));
      while (result.length && !result[0].text.trimStart()) result.shift();
      while (result.length && !result[result.length - 1].text.trimEnd()) result.pop();
      if (result.length) {
        result[0].text = result[0].text.trimStart();
        result[result.length - 1].text = result[result.length - 1].text.trimEnd();
      }
      return result;
    }
    function codeDelimiter(text, minimum = 1) {
      const longest = Math.max(0, ...Array.from(text.matchAll(/`+/g), match => match[0].length));
      return '`'.repeat(Math.max(minimum, longest + 1));
    }
    function walk(node, context = {}) {
      if (node.nodeType === Node.TEXT_NODE) {
        if (context.bold || context.italic) meaningful = true;
        return [{ text: escapeMarkdown(node.nodeValue.replace(/\u00a0/g, ' ')), bold: !!context.bold, italic: !!context.italic }];
      }
      if (node.nodeType !== Node.ELEMENT_NODE && node.nodeType !== Node.DOCUMENT_FRAGMENT_NODE) return [];
      const tag = node.tagName;
      if (ignored.has(tag) || node.hasAttribute?.('hidden')) return [];
      if (tag === 'BR') return [raw('\n')];
      if (tag === 'IMG') return [{ text: escapeMarkdown(node.getAttribute('alt') || ''), bold: !!context.bold, italic: !!context.italic }];
      if (tag === 'PRE') {
        meaningful = true;
        const text = node.textContent.replace(/\n$/, '');
        const fence = codeDelimiter(text, 3);
        return [raw('\n\n' + fence + '\n' + text + '\n' + fence + '\n\n')];
      }
      if (tag === 'CODE') {
        meaningful = true;
        const text = node.textContent;
        const marker = codeDelimiter(text);
        const padding = /^`|`$/.test(text) || (/^ .* $/.test(text) && /[^ ]/.test(text)) ? ' ' : '';
        return [raw(marker + padding + text + padding + marker)];
      }
      const style = node.getAttribute?.('style') || '';
      const weight = /(?:^|;)\s*font-weight\s*:\s*(bold(?:er)?|[6-9]00)\b/i.test(style);
      const normalWeight = /(?:^|;)\s*font-weight\s*:\s*(normal|[1-5]00)\b/i.test(style);
      const normalItalic = /(?:^|;)\s*font-style\s*:\s*normal\b/i.test(style);
      // Google Docs wraps clipboard HTML in <b style="font-weight: normal">.
      const isBold = (!normalWeight && (tag === 'B' || tag === 'STRONG' || /^H[1-6]$/.test(tag || ''))) || weight;
      const isItalic = (!normalItalic && (tag === 'I' || tag === 'EM')) || /(?:^|;)\s*font-style\s*:\s*(italic|oblique)\b/i.test(style);
      const nextContext = {
        bold: normalWeight ? false : isBold || !!context.bold,
        italic: normalItalic ? false : isItalic || !!context.italic
      };
      let value = Array.from(node.childNodes).flatMap(child => walk(child, nextContext));
      if (tag === 'A') {
        const href = node.getAttribute('href') || '';
        if (/^(https?:\/\/|mailto:)/i.test(href)) {
          meaningful = true;
          value = [raw('['), ...trimFragments(value), raw('](' + href.replace(/\s/g, char => encodeURIComponent(char)) + ')')];
        }
      }
      if (tag === 'LI') {
        const parent = node.parentElement;
        let marker = '- ';
        if (parent?.tagName === 'OL') {
          const siblings = Array.from(parent.children).filter(child => child.tagName === 'LI');
          const start = Number.parseInt(parent.getAttribute('start') || '1', 10);
          const explicit = Number.parseInt(node.getAttribute('value'), 10);
          marker = (Number.isFinite(explicit) ? explicit : (Number.isFinite(start) ? start : 1) + siblings.indexOf(node)) + '. ';
        }
        meaningful = true;
        return [raw(marker), ...trimFragments(value), raw('\n')];
      }
      if (tag === 'UL' || tag === 'OL') return [raw('\n\n'), ...trimFragments(value), raw('\n\n')];
      if (['P', 'DIV', 'SECTION', 'ARTICLE', 'BLOCKQUOTE'].includes(tag) || /^H[1-6]$/.test(tag || '')) return [raw('\n\n'), ...trimFragments(value), raw('\n\n')];
      return value;
    }
    // Keep shared styles open across adjacent text nodes, and close them before
    // whitespace boundaries or raw Markdown. This preserves child style resets
    // and prevents emphasis delimiters from straddling separate source lines.
    const fragments = [];
    for (const part of walk(root)) {
      const previous = fragments[fragments.length - 1];
      if (previous && !part.raw && !previous.raw && part.bold === previous.bold && part.italic === previous.italic) previous.text += part.text;
      else fragments.push({ ...part });
    }
    let markdown = '';
    const active = [];
    const marker = style => style === 'bold' ? '**' : '*';
    function transition(desired) {
      let keep = 0;
      while (keep < active.length && desired[active[keep]]) keep++;
      while (active.length > keep) markdown += marker(active.pop());
      for (const style of desired.styleOrder || ['bold', 'italic']) if (desired[style] && !active.includes(style)) {
        active.push(style); markdown += marker(style);
      }
    }
    for (const [fragmentIndex, part] of fragments.entries()) {
      if (part.raw) { transition({}); markdown += part.text; continue; }
      if (part.bold && part.italic) {
        // When both styles begin together, keep the next surviving style outside
        // so a child reset can close only the inner delimiter.
        for (let next = fragmentIndex + 1; next < fragments.length; next++) {
          const upcoming = fragments[next];
          if (upcoming.raw || (!upcoming.bold && !upcoming.italic)) break;
          if (upcoming.bold !== upcoming.italic) {
            part.styleOrder = upcoming.italic ? ['italic', 'bold'] : ['bold', 'italic'];
            break;
          }
        }
      }
      const lines = part.text.split('\n');
      lines.forEach((line, index) => {
        if (index) { transition({}); markdown += '\n'; }
        const [, before, center, after] = /^(\s*)([\s\S]*?)(\s*)$/.exec(line);
        if (before) { transition({}); markdown += before; }
        if (center) { transition(part); markdown += center; }
        if (after) { transition({}); markdown += after; }
      });
    }
    transition({});
    markdown = markdown.replace(/[ \t]+\n/g, '\n').replace(/\n{3,}/g, '\n\n').trim();
    return { markdown, meaningful };
  }
  source.addEventListener('paste', (event) => {
    if (!event.clipboardData) return;
    const html = event.clipboardData.getData('text/html');
    const text = event.clipboardData.getData('text/plain');
    const isMarkdown = /(?:\*\*\S|__\S|\[[^\]\n]+\]\(https?:\/\/|^\s*#{1,6}\s)/m.test(text);
    const converted = html && $('richPaste').checked && !isMarkdown ? richTextToMarkdown(html) : null;
    const markdown = converted?.markdown || text;
    event.preventDefault();
    rememberSelection(); insertEditorHtml(PostFormatter.toEditorHtml(markdown));
  });

  // Exposed for deterministic browser checks; no draft is sent anywhere.
  window.PostformApp = { richTextToMarkdown, draftMarkdown, sanitizeEditorHtml };
  $('saveStatus').textContent = storageAvailable ? savedDraft ? 'Previous draft available' : 'Drafts saved on this device' : 'Draft kept in this tab';
  render(false);
  window.addEventListener('pagehide', () => {
    savePreferences(); flushDraft();
  });
}());
</script>
</body>
